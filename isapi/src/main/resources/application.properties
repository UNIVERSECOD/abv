spring.application.name=hr-erp-isapi

# Database
spring.datasource.url=${DB_URL:jdbc:postgresql://postgres:5432/hic_isapi}
spring.datasource.username=${DB_USERNAME:hic_user}
spring.datasource.password=${DB_PASSWORD:hic_password}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.table=flyway_schema_history_isapi
spring.flyway.baseline-on-migrate=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

server.port=8081
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Shared secret required from backend (header X-API-Key). Mandatory when SPRING_PROFILES_ACTIVE=prod.
isapi.api-key=${ISAPI_API_KEY:}

isapi.alertStream.disconnectBackoffBaseSeconds=3
isapi.alertStream.deployExceedMaxBackoffSeconds=300
# Hikvision ANPR streams can keep heartbeats flowing while capture notifications stall.
# Refresh only ANPR subscriptions periodically; ordinary access-control streams remain long-lived.
isapi.alertStream.anprMaxConnectionSeconds=${ANPR_STREAM_MAX_CONNECTION_SECONDS:600}

acs.history.major=${ACS_HISTORY_MAJOR:5}
acs.history.minor=${ACS_HISTORY_MINOR:75}
