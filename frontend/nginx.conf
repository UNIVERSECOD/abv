server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ ^/api/devices/[0-9]+/employees/reconciliation/(preview|apply)$ {
        proxy_pass http://backend:8080;
        proxy_read_timeout 180s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /api/settings/backup/operations/inspect {
        client_max_body_size 4g;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # The first device import can synchronously backfill access history from
    # 2026-10-01 for multiple terminals. Keep this one request alive while the
    # backend waits for the read-only ISAPI history pull to finish.
    location = /api/setup/import-employees {
        proxy_pass http://backend:8080;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api {
        client_max_body_size 6m;
        error_page 413 = @upload_too_large;
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location @upload_too_large {
        default_type application/json;
        charset utf-8;
        return 413 '{"success":false,"message":"Yükləmə limiti aşıldı. Fayl ən çox 5 MB ola bilər. Daha kiçik fayl seçin.","data":null}';
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
    }
}
